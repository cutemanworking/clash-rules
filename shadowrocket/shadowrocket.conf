# Shadowrocket Config - from mihomo passwall latest (simplified)
# Rules: https://github.com/cutemanworking/clash-rules (shadowrocket/*.list)
# 策略组仅按地区；默认 PROXY；节点用订阅导入
# ---

[General]
# 使用 Shadowrocket 常见默认，不硬套 mihomo
bypass-system = true
skip-proxy = localhost,*.local,captive.apple.com,guzzoni.apple.com,0.0.0.0/8,10.0.0.0/8,17.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.168.0.0/16,192.88.99.0/24,198.18.0.0/15,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,240.0.0.0/4,255.255.255.255/32
tun-excluded-routes = 10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.168.0.0/16,192.88.99.0/24,198.18.0.0/15,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32
dns-server = system
ipv6 = false

[Proxy Group]
# --- 主策略：默认 PROXY，可选各地区自动 ---
PROXY = select, All Auto, 🇭🇰 HK Auto, 🇯🇵 JP Auto, 🇸🇬 SG Auto, 🇺🇸 US Auto, 🇹🇼 TW Auto, DIRECT

# --- 地区自动 (url-test) ---
🇭🇰 HK Auto = url-test, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=200, timeout=5, policy-regex-filter=(?=.*((?i)🇭🇰|香港|\b(HK|Hong)\b))(?!.*((?i)回国|校园|Traffic|Expire|到期))
🇯🇵 JP Auto = url-test, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=300, timeout=5, policy-regex-filter=(?=.*((?i)🇯🇵|日本|\b(JP|Japan)\b))(?!.*((?i)回国|校园|Traffic|Expire|到期))
🇸🇬 SG Auto = url-test, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=200, timeout=5, policy-regex-filter=(?=.*((?i)🇸🇬|新加坡|狮|\b(SG|Singapore)\b))(?!.*((?i)回国|校园|Traffic|Expire|到期))
🇺🇸 US Auto = url-test, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=400, timeout=5, policy-regex-filter=(?=.*((?i)🇺🇸|美国|\b(US|United States)\b))(?!.*((?i)回国|校园|Traffic|Expire|到期))
🇹🇼 TW Auto = url-test, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=300, timeout=5, policy-regex-filter=(?=.*((?i)🇹🇼|台湾|\b(TW|Tai|Taiwan)\b))(?!.*((?i)回国|校园|Traffic|Expire|到期))
All Auto = url-test, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=200, timeout=5, policy-regex-filter=^(?!.*((?i)Traffic|Expire|到期|官网|客服|订阅)).*$

# --- 应用策略组：默认跟 PROXY，可单独改地区 ---
